# SDDM for Ludus, set up the way Omarchy runs it: the greeter on Wayland,
# inside a bare Hyprland, with the Ludus theme.
#
# SDDM's built-in Wayland compositor is Weston, and Fedora's sddm pulls
# Weston in to have one; CompositorCommand below runs the greeter in
# Hyprland instead, so the login screen looks and behaves like the session.
[Theme]
Current=ludus

[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
