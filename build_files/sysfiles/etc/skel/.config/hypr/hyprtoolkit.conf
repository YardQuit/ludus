# ~/.config/hypr/hyprtoolkit.conf - colours for Hyprland's own apps
# (hyprlauncher, hyprshutdown, hyprland-guiutils' dialogs, the polkit
# agent), in the ao-dark palette.

background       = rgb(080d15)   # deep-abyss
base             = rgb(0d1526)   # midnight-thunder
alternate_base   = rgb(1f2937)   # nightfall-blue
text             = rgb(dadada)   # ao-white
bright_text      = rgb(f3f4f6)   # winter-sky
accent           = rgb(ff9000)   # blaze-orange
accent_secondary = rgb(7533bd)   # light-purple

font_family           = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font
rounding_large        = 2
rounding_small        = 2
