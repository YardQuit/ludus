# ~/.config/hypr/hypridle.conf - when the screen locks and blanks.
#
# Omarchy's timings: the lock after two and a half minutes idle, and before
# every suspend. Super+Escape locks by hand (loginctl lock-session, which
# lands on lock_cmd below).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3    # hold suspend until the lock screen is up
}

listener {
    timeout = 150
    on-timeout = loginctl lock-session
}

listener {
    timeout = 180
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
