# ~/.config/hypr/hyprlock.conf - the lock screen.
#
# Omarchy's hyprlock layout (a single wide password field, nothing else),
# in the ao-dark palette: navy ground, orange ring, violet on a good
# password.
#
# Omarchy is MIT-licensed; its notice is at /usr/share/licenses/ludus/Omarchy-LICENSE.

$bg     = rgba(8, 13, 21, 1.0)       # deep-abyss
$field  = rgba(13, 21, 38, 0.8)      # midnight-thunder
$accent = rgba(255, 144, 0, 1.0)     # blaze-orange
$text   = rgba(218, 218, 218, 1.0)   # ao-white
$check  = rgba(117, 51, 189, 1.0)    # light-purple
$fail   = rgba(250, 121, 112, 1.0)   # ruby-glow

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $field
    outer_color = $accent
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $text

    placeholder_text = Enter Password
    check_color = $check
    fail_color = $fail
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
