# ~/.config/hypr/xdph.conf - xdg-desktop-portal-hyprland.
#
# Omarchy's settings: screen sharing picks through
# hyprland-preview-share-picker, which shows live previews of each window
# and output, and an app that asks to restore a share it was granted before
# gets it without asking again.

screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
}
